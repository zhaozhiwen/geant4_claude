name: lint

on:
  push:
  pull_request:

jobs:
  skill-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Strict-YAML lint of every SKILL.md frontmatter
        # Catches the colon-space class of frontmatter bug that Codex's strict
        # YAML parser rejects (and Claude silently tolerates) — which would drop
        # the whole skill on Codex without any error.
        run: python3 tests/lint-skill-frontmatter.py
      - name: CLAUDE.md must mirror its canonical AGENTS.md (symlink invariant)
        # AGENTS.md is the real file; CLAUDE.md is a symlink → AGENTS.md.
        # codex plugin add drops the symlink and keeps the real AGENTS.md.
        run: tests/lint-agents-mirror.sh

  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n the shell scripts
        run: |
          set -e
          for f in bin/g4run tests/clean-smoke.sh tests/clean-install-test.sh \
                   tests/exit-capture-test.sh tests/g4run-unit-test.sh \
                   tests/lint-agents-mirror.sh scripts/ensure_venv.sh; do
            bash -n "$f" && echo "ok: $f"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: py_compile the Python helpers
        run: |
          python3 -m py_compile \
            tests/lint-skill-frontmatter.py \
            scripts/preview_gdml.py \
            scripts/validators/cherenkov.py \
            templates/workspace/embed_html.py \
            templates/example/analysis/example.py
